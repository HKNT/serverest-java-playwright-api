name: Regressao (collection demorada - pós merge + Allure)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  testes_regressao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código da main
        uses: actions/checkout@v5

      - name: Configurar o Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # roda todos os testes olhando para prod (sem o BASE_URL apontando para o localhost
      - name: Rodar testes regressivos
        run: mvn clean test

      - name: Gerar o site de relatorio (allure report)
        if: always()
        run: mvn allure:report

      - name: Publicar no github pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: target/site/allure-maven-plugin