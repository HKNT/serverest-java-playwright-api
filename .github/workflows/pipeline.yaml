name: Pipeline de Testes API - ServeRest

#gatilhos - Situações em que a esteira irá executar
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Permissão - criar a pagina de report do Allure
permissions:
  contents: write

#função - O que a esteira fará
jobs:
  testes_playwright:
    runs-on: ubuntu-latest

# config do docker
    services:
      serverest-api:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - 3000:3000

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

# apontando os testes para o docker da esteira
      - name: Rodar os testes via Maven no docker
        env:
          BASE_URL: http://localhost:3000
        run: mvn clean test -Dgroups="smoke"

      - name: Rodar os testes via Maven
        run: mvn clean test

      - name: Gerar site estático Allure
        if: always()
        run: mvn allure:report

      - name: Publicar site Allure no gitPages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: target/site/allure-maven-plugin