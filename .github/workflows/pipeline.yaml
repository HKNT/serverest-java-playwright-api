name: Pipeline de Testes API - ServeRest

#gatilhos - Situações em que a esteira irá executar
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

#função - O que a esteira fará
jobs:
  testes_playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rodar os testes via Maven
        run: mvn clean test

      - name: Salvar a pasta de resultados (Jsons do allure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-allure
          path: target/allure-results/
          retention-days: 7