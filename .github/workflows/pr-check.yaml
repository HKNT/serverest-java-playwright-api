name: Validacao de Pull Request (Smoke + Docker)

on:
  pull_request:
    branches: [ "main" ]

jobs:
  smoke_tests:
    runs-on: ubuntu-latest

    # ambiente efemero - docker
    services:
      serverest-api:
        image: paulogoncalvesbh/serverest:latest
        ports:
          - "3000:3000"

    steps:
      - name: Baixar o codigo do github
        uses: actions/checkout@v5

      - name: Configurar o Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # config de testes - rodar somente com a tag smoke
      - name: Rodar smoke-testes no docker
        env:
          BASE_URL: http://localhost:3000
        run: mvn clean test -Dgroups="smoke"

# Aqui só busco trazer resultados rapidos para dispensar ou ter o apoio do DEV.